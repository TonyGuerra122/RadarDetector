# Gera o APK de release assinado e envia para o servidor de arquivos via SSH (rsync).
#
# Como disparar:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64  conteúdo de: base64 -w0 radardetector-release.jks
#   RELEASE_STORE_PASSWORD   senha da keystore
#   RELEASE_KEY_ALIAS        alias da chave (radardetector)
#   RELEASE_KEY_PASSWORD     senha da chave
#   DEPLOY_HOST              endereço do servidor (ex.: arquivos.meudominio.com)
#   DEPLOY_PORT              porta SSH (ex.: 22)
#   DEPLOY_USER              usuário SSH só para deploy
#   DEPLOY_PATH              pasta de destino no servidor (ex.: /srv/arquivos/radardetector)
#   DEPLOY_SSH_KEY           chave SSH privada (ed25519) cuja pública está no authorized_keys do servidor
#   DEPLOY_KNOWN_HOSTS       saída de: ssh-keyscan -p <porta> <host>

name: Deploy APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Nunca roda dois deploys ao mesmo tempo, mas também não cancela um que já começou.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Definir versão a partir da tag
        # v1.2.0 → versionName "1.2.0". O versionCode usa o número da execução, que sempre cresce.
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Recriar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build do APK de release
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Conferir assinatura
        # Falha o deploy se o APK saiu sem assinatura ou com a chave errada.
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Preparar arquivos
        run: |
          mkdir -p dist
          APK="RadarDetector-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          ls -l dist

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # known_hosts fixo (em vez de ssh-keyscan aqui) evita aceitar um servidor falso.
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Enviar para o servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT:-22} -o StrictHostKeyChecking=yes" \
            dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Guardar APK no GitHub também
        uses: actions/upload-artifact@v5
        with:
          name: RadarDetector-${{ env.VERSION_NAME }}
          path: dist/
          retention-days: 30

      - name: Limpar credenciais
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" ~/.ssh/deploy_key
